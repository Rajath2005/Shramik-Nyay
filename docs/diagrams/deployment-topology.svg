<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">Shramik-Nyay production deployment topology</title>
  <desc id="desc">Visitors use a static frontend on Vercel, Netlify, or Cloudflare Pages. It connects over WSS to a Dockerized Render backend, which holds secrets and calls Gnani only in LIVE mode.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#2487c9"/></marker><marker id="o" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#d96b27"/></marker><style>.t{font:700 29px Arial;fill:#17232d}.s{font:16px Arial;fill:#52606d}.h{font:700 17px Arial}.b{font:15px Arial}.box{stroke-width:2}.blue{fill:#e8f4ff;stroke:#2487c9}.green{fill:#eaf8ef;stroke:#2f9e62}.amber{fill:#fff7e2;stroke:#d99a18}.orange{fill:#fff0e6;stroke:#d96b27}.gray{fill:#f2f5f7;stroke:#66788a}.l{fill:none;stroke:#2487c9;stroke-width:2.5;marker-end:url(#a)}.d{fill:none;stroke:#d96b27;stroke-width:2.5;stroke-dasharray:8 7;marker-end:url(#o)}</style></defs>
  <rect width="1400" height="780" fill="#fff"/><text x="55" y="58" class="t">Shramik-Nyay | Production deployment topology</text><text x="55" y="88" class="s">HTTPS frontend, WSS backend, and server-only secrets</text>
  <rect x="60" y="225" width="230" height="160" rx="12" class="box blue"/><text x="175" y="265" text-anchor="middle" class="h" fill="#17324d">VISITOR</text><text x="175" y="305" text-anchor="middle" class="b" fill="#17324d">Browser over HTTPS</text><text x="175" y="333" text-anchor="middle" class="b" fill="#17324d">Microphone permission</text><text x="175" y="361" text-anchor="middle" class="b" fill="#17324d">Public MOCK replay</text>
  <rect x="375" y="190" width="330" height="230" rx="12" class="box green"/><text x="540" y="230" text-anchor="middle" class="h" fill="#173d29">STATIC HOST</text><text x="540" y="270" text-anchor="middle" class="b" fill="#173d29">Vercel / Netlify / Cloudflare Pages</text><text x="540" y="300" text-anchor="middle" class="b" fill="#173d29">npm run build → frontend/dist</text><text x="540" y="330" text-anchor="middle" class="b" fill="#173d29">VITE_WS_URL is public config</text><text x="540" y="360" text-anchor="middle" class="b" fill="#173d29">No provider secrets in bundle</text>
  <rect x="790" y="170" width="330" height="270" rx="12" class="box amber"/><text x="955" y="210" text-anchor="middle" class="h" fill="#4d3a0c">RENDER WEB SERVICE</text><text x="955" y="250" text-anchor="middle" class="b" fill="#4d3a0c">Docker: backend/Dockerfile</text><text x="955" y="280" text-anchor="middle" class="b" fill="#4d3a0c">HTTPS / WSS upgrade</text><text x="955" y="310" text-anchor="middle" class="b" fill="#4d3a0c">/health healthcheck</text><text x="955" y="340" text-anchor="middle" class="b" fill="#4d3a0c">PORT supplied by host</text><text x="955" y="370" text-anchor="middle" class="b" fill="#4d3a0c">WebSocket-capable process</text>
  <rect x="790" y="560" width="330" height="150" rx="12" class="box orange"/><text x="955" y="600" text-anchor="middle" class="h" fill="#572610">SERVER ENVIRONMENT</text><text x="955" y="632" text-anchor="middle" class="b" fill="#572610">CORS · passcode · API key</text><text x="955" y="660" text-anchor="middle" class="b" fill="#572610">credit caps · claim TTL</text><text x="955" y="688" text-anchor="middle" class="b" fill="#572610">Never shipped to browser</text>
  <rect x="1200" y="250" width="150" height="150" rx="12" class="box gray"/><text x="1275" y="288" text-anchor="middle" class="h" fill="#263746">GNANI API</text><text x="1275" y="322" text-anchor="middle" class="b" fill="#263746">STT</text><text x="1275" y="348" text-anchor="middle" class="b" fill="#263746">LLM</text><text x="1275" y="374" text-anchor="middle" class="b" fill="#263746">TTS</text>
  <path d="M290 305H375" class="l"/><path d="M705 305H790" class="l"/><path d="M955 440V560" class="d"/><path d="M1120 305H1200" class="d"/>
  <rect x="60" y="560" width="560" height="150" rx="12" class="box gray"/><text x="85" y="600" class="h" fill="#263746">Deployment invariant</text><text x="85" y="635" class="b" fill="#263746">VITE_WS_URL is the only production browser setting.</text><text x="85" y="665" class="b" fill="#263746">GNANI_API_KEY and SHRAMIK_LIVE_PASSCODE stay on the backend host.</text></svg>
