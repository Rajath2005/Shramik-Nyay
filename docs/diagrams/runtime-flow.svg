<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Shramik-Nyay request and safety flow</title>
  <desc id="desc">A session opens with per-IP rate limiting, starts in MOCK_REPLAY, and only enters the live path after passcode authentication and credit checks. Claim preparation requires consent and uses TTL cleanup.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#2487c9"/></marker><style>.t{font:700 29px Arial;fill:#17232d}.s{font:16px Arial;fill:#52606d}.h{font:700 16px Arial}.b{font:14px Arial}.box{stroke-width:2}.blue{fill:#e8f4ff;stroke:#2487c9}.purple{fill:#f1edff;stroke:#7654c7}.amber{fill:#fff7e2;stroke:#d99a18}.orange{fill:#fff0e6;stroke:#d96b27}.green{fill:#eaf8ef;stroke:#2f9e62}.gray{fill:#f2f5f7;stroke:#66788a}.l{fill:none;stroke:#2487c9;stroke-width:2.5;marker-end:url(#a)}.dash{fill:none;stroke:#7654c7;stroke-width:2.5;stroke-dasharray:8 7;marker-end:url(#a)}</style></defs>
  <rect width="1400" height="760" fill="#fff"/><text x="55" y="58" class="t">Shramik-Nyay | Request and safety flow</text><text x="55" y="88" class="s">Public replay by default; live voice is explicit, authorized, rate-limited, and credit-capped</text>
  <rect x="55" y="175" width="220" height="155" rx="12" class="box blue"/><text x="165" y="215" text-anchor="middle" class="h" fill="#17324d">1 · OPEN SESSION</text><text x="165" y="250" text-anchor="middle" class="b" fill="#17324d">WSS connection</text><text x="165" y="278" text-anchor="middle" class="b" fill="#17324d">Per-IP window checked</text><text x="165" y="306" text-anchor="middle" class="b" fill="#17324d">Reject excess attempts</text>
  <rect x="350" y="175" width="220" height="155" rx="12" class="box purple"/><text x="460" y="215" text-anchor="middle" class="h" fill="#34205f">2 · MOCK_REPLAY</text><text x="460" y="250" text-anchor="middle" class="b" fill="#34205f">Synthetic profile</text><text x="460" y="278" text-anchor="middle" class="b" fill="#34205f">Recorded / sample flow</text><text x="460" y="306" text-anchor="middle" class="b" fill="#34205f">No provider credits</text>
  <rect x="645" y="175" width="220" height="155" rx="12" class="box amber"/><text x="755" y="215" text-anchor="middle" class="h" fill="#4d3a0c">3 · LIVE?</text><text x="755" y="250" text-anchor="middle" class="b" fill="#4d3a0c">Explicit user action</text><text x="755" y="278" text-anchor="middle" class="b" fill="#4d3a0c">Passcode required</text><text x="755" y="306" text-anchor="middle" class="b" fill="#4d3a0c">Invalid stays blocked</text>
  <rect x="940" y="175" width="220" height="155" rx="12" class="box orange"/><text x="1050" y="215" text-anchor="middle" class="h" fill="#572610">4 · AUTHORIZE</text><text x="1050" y="250" text-anchor="middle" class="b" fill="#572610">Server-side compare</text><text x="1050" y="278" text-anchor="middle" class="b" fill="#572610">No secret in bundle</text><text x="1050" y="306" text-anchor="middle" class="b" fill="#572610">Unlock this session</text>
  <rect x="940" y="465" width="220" height="155" rx="12" class="box green"/><text x="1050" y="505" text-anchor="middle" class="h" fill="#173d29">5 · VOICE TURN</text><text x="1050" y="540" text-anchor="middle" class="b" fill="#173d29">Prisma raw PCM</text><text x="1050" y="568" text-anchor="middle" class="b" fill="#173d29">Evon slots + audit</text><text x="1050" y="596" text-anchor="middle" class="b" fill="#173d29">Timbre read-back</text>
  <rect x="645" y="465" width="220" height="155" rx="12" class="box gray"/><text x="755" y="505" text-anchor="middle" class="h" fill="#263746">6 · ENFORCE CAPS</text><text x="755" y="540" text-anchor="middle" class="b" fill="#263746">Provider credit guard</text><text x="755" y="568" text-anchor="middle" class="b" fill="#263746">Failure fallback</text><text x="755" y="596" text-anchor="middle" class="b" fill="#263746">No silent overrun</text>
  <rect x="350" y="465" width="220" height="155" rx="12" class="box amber"/><text x="460" y="505" text-anchor="middle" class="h" fill="#4d3a0c">7 · CONSENT</text><text x="460" y="540" text-anchor="middle" class="b" fill="#4d3a0c">Read-back approval</text><text x="460" y="568" text-anchor="middle" class="b" fill="#4d3a0c">Required before draft</text><text x="460" y="596" text-anchor="middle" class="b" fill="#4d3a0c">Delete remains available</text>
  <rect x="55" y="465" width="220" height="155" rx="12" class="box blue"/><text x="165" y="505" text-anchor="middle" class="h" fill="#17324d">8 · CLAIM DRAFT</text><text x="165" y="540" text-anchor="middle" class="b" fill="#17324d">Deterministic arithmetic</text><text x="165" y="568" text-anchor="middle" class="b" fill="#17324d">Form A PDF + JSON</text><text x="165" y="596" text-anchor="middle" class="b" fill="#17324d">TTL cleanup</text>
  <path d="M275 252H350" class="l"/><path d="M570 252H645" class="l"/><path d="M865 252H940" class="l"/><path d="M1050 330V465" class="l"/><path d="M940 542H865" class="l"/><path d="M645 542H570" class="l"/><path d="M350 542H275" class="l"/><path d="M755 330V465" class="dash"/><text x="775" y="410" class="b" fill="#7654c7">live path</text></svg>
